[project]
name = "pipeline"
version = "0.1.0"
description = "VANTAGE offline pipeline: NISAR change detection, road graph, closure impact."

requires-python = ">=3.12"
dependencies = [
    "earthaccess>=0.19.0",
    "h5py>=3.16.0",
    "jsonschema>=4.26.0",
    "osmnx>=2.1.1",
    "rasterio>=1.5.2",
]

[project.scripts]
pipeline = "pipeline:main"
validate = "pipeline.validate:main"
area-config = "pipeline.area_config:main"
timecheck = "pipeline.time_crosscheck:main"
rank-sensitivity = "pipeline.rank_sensitivity:main"
manual-review = "pipeline.manual_review:main"
road-graph = "pipeline.road_graph:main"
closure-units = "pipeline.closure_units:main"
impact-scoring = "pipeline.impact_scoring:main"
pipeline-run = "pipeline.pipeline_run:main"
population-data = "pipeline.population_data:main"
rain-context = "pipeline.rain_context:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pipeline"
module-root = "source"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["testing"]
