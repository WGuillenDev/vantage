[project]
name = "pipeline"
version = "0.1.0"
description = "VANTAGE offline pipeline: NISAR change detection, road graph, closure impact."

requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
]

[project.scripts]
pipeline = "pipeline:main"
validate = "pipeline.validate:main"
area-config = "pipeline.area_config:main"
timecheck = "pipeline.time_crosscheck:main"
manual-review = "pipeline.manual_review:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pipeline"
module-root = "source"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["testing"]
