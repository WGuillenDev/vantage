name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
      # shortcut: ships mocks; switch to `make publish` once pipeline/output has real data.
      - run: make mock
      - run: make validate
      - run: bun install --frozen-lockfile
        working-directory: projects/frontend
      - run: bun run build
        working-directory: projects/frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: projects/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
